# One-command local run: `docker compose up --build`.
# Frontend: http://localhost:5173  Backend: http://localhost:8000/healthz
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
      PORT: "8000"

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./web:/app
      # Anonymous volume so the container gets its own node_modules
      # (npm ci installs Linux binaries here) instead of whatever the host
      # OS installed into ./web/node_modules.
      - /app/node_modules
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    depends_on:
      - api
